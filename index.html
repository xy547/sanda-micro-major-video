  .player-card{

  .player-card::before{

    -webkit-mask-composite:xor;mask-composite:exclude;
    pointer-events:none;
  }
  .ratio{
    position:relative;width:100%;aspect-ratio:16/9;
    border-radius:14px;overflow:hidden;background:#05070e;
  }
  video{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;object-fit:contain;background:#05070e;
    outline:none;
  }

  /* ---------- 信息条 ---------- */
  .meta{

  .meta span{display:inline-flex;align-items:center;gap:7px}

  /* ---------- 操作 ---------- */

  .btn:active{transform:translateY(1px)}
  .btn-primary{

    background:linear-gradient(180deg,#f2cc8c,#e0a952);

  .btn-ghost{color:#cfd7ea;background:rgba(255,255,255,.05);border-color:var(--line)}
  .btn-ghost:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2)}
  .btn svg{width:16px;height:16px;flex:none}

  footer{

</style>

<script>
  (function () {
    var v = document.getElementById('player');
    // 记住上次播放进度，刷新/二次访问能接着看
    var KEY = 'sanda-promo-time';
    var saved = parseFloat(localStorage.getItem(KEY) || '0');
    if (saved > 1.5) {
      v.addEventListener('loadedmetadata', function () {
        if (saved < v.duration - 1) v.currentTime = saved;
      }, { once: true });
    }
    var tick = null;
    v.addEventListener('play', function () {
      if (tick) return;
      tick = setInterval(function () {
        try { localStorage.setItem(KEY, String(v.currentTime)); } catch (e) {}
      }, 1000);
    });
    v.addEventListener('pause', function () { clearInterval(tick); tick = null; });
    v.addEventListener('ended', function () {
      clearInterval(tick); tick = null;
      try { localStorage.removeItem(KEY); } catch (e) {}
    });
  })();
</script>
